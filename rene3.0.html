<div id="jst">
      <canvas id="myChart" style="width:100%;max-width:700px"></canvas>
<script> 
const xyValues = [
  {x:90, y:7},
  {x:100, y:8},
  {x:105, y:8},
  {x:118, y:9},
  {x:128, y:9},
  {x:135, y:9},
  {x:140, y:10},
  {x:145, y:12},
  {x:148, y:13},
  {x:152, y:15},
  {x:158, y:17}
];

const ctx = document.getElementById('myChart');

new Chart(ctx, {
  type: "scatter",
  data: {
    datasets: [{
      pointRadius: 4,
      pointBackgroundColor: "rgb(251,116,168)",
      data: xyValues
    }]
  },
  options: {
    plugins: {
      legend: {display:false},
      title: {
        display: true,
        text: "height in these 17years",
        font: {size:16}
      }
    }
  }
});
</script>
